services:
  backend:
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "${BENCHMARK_UVICORN_WORKERS:-1}"]
    environment:
      DATABASE_URL: ${BENCHMARK_DATABASE_URL:?BENCHMARK_DATABASE_URL is required}
      DATA_DIR: ${BENCHMARK_DATA_DIR:?BENCHMARK_DATA_DIR is required}
      ELASTICSEARCH_PRODUCTS_ALIAS: ${BENCHMARK_ES_ALIAS:?BENCHMARK_ES_ALIAS is required}
      ELASTICSEARCH_CATALOG_PRODUCTS_ALIAS: ${BENCHMARK_ES_ALIAS:?BENCHMARK_ES_ALIAS is required}
      RECOMMENDATION_SCORING_READ_PATH: ${BENCHMARK_RECOMMENDATION_SCORING_READ_PATH:-legacy_bulk}
      REDIS_KEY_PREFIX: ${BENCHMARK_REDIS_KEY_PREFIX:-mubarelle:benchmark:}
      RECOMMENDATION_CANDIDATE_CACHE_ENABLED: ${BENCHMARK_RECOMMENDATION_CANDIDATE_CACHE_ENABLED:-false}
      RECOMMENDATION_CANDIDATE_CACHE_TTL_SECONDS: ${BENCHMARK_RECOMMENDATION_CANDIDATE_CACHE_TTL_SECONDS:-300}
      RECOMMENDATION_CANDIDATE_PRICE_CACHE_TTL_SECONDS: ${BENCHMARK_RECOMMENDATION_CANDIDATE_PRICE_CACHE_TTL_SECONDS:-60}
      RECOMMENDATION_CANDIDATE_CACHE_SOCKET_CONNECT_TIMEOUT_SECONDS: ${BENCHMARK_RECOMMENDATION_CANDIDATE_CACHE_SOCKET_CONNECT_TIMEOUT_SECONDS:-0.05}
      RECOMMENDATION_CANDIDATE_CACHE_SOCKET_TIMEOUT_SECONDS: ${BENCHMARK_RECOMMENDATION_CANDIDATE_CACHE_SOCKET_TIMEOUT_SECONDS:-0.05}
