services:
  backend:
    # 서버에서는 소스 감시 없이 단일 Uvicorn 프로세스로 실행합니다.
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "${UVICORN_WORKERS:-2}"]

  caddy:
    image: caddy:2-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-mwobareullae}-caddy
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.mubarelle.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_started
    networks:
      - app_network
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
