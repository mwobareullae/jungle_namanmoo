name: ci

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      backend_test_suite:
        description: "Backend pytest suite to run"
        required: true
        default: full
        type: choice
        options:
          - fast
          - full

jobs:
  infra:
    name: infra checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Lint frontend
        working-directory: apps/frontend
        run: npm run lint

      - name: Build frontend
        working-directory: apps/frontend
        run: npm run build

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "README.md"
            ".env.example"
            "docker-compose.yml"
            "apps/frontend/README.md"
            "apps/frontend/Dockerfile"
            "apps/frontend/package.json"
            "apps/frontend/index.html"
            "apps/frontend/vite.config.ts"
            "apps/frontend/src/main.tsx"
            "apps/frontend/src/styles.css"
            "apps/frontend/src/vite-env.d.ts"
            "apps/backend/README.md"
            "apps/backend/Dockerfile"
            "apps/backend/alembic.ini"
            "apps/backend/migrations/env.py"
            "apps/backend/migrations/script.py.mako"
            "apps/backend/requirements.txt"
            "apps/backend/requirements-dev.txt"
            "apps/backend/pytest.ini"
            "apps/backend/app/main.py"
            "docs/data-contract.md"
            "data/README.md"
          )

          for file in "${required_files[@]}"; do
            test -f "$file"
          done

      - name: Check no real env files
        shell: bash
        run: |
          set -euo pipefail

          if find . -type f -name ".env*" ! -name ".env.example" ! -name ".env.*.example" | grep -q .; then
            echo "Do not commit real environment files."
            exit 1
          fi

      - name: Validate Docker Compose config
        run: docker compose config

      - name: Start Docker Compose services
        run: docker compose up --build -d

      - name: Check backend hello endpoint
        run: curl --fail --retry 20 --retry-all-errors --retry-delay 2 http://localhost:8000/api/health

      - name: Run backend fast tests
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.backend_test_suite == 'fast')
        shell: bash
        run: |
          docker compose exec -T backend python -m pytest \
            tests/test_db_setup.py \
            tests/test_api_contracts.py::test_health_endpoint_returns_ok \
            tests/test_api_contracts.py::test_health_endpoint_includes_request_observability_headers \
            tests/test_api_contracts.py::test_openapi_docs_are_available \
            tests/test_auth_api.py \
            tests/test_address_api.py \
            tests/test_cart_checkout_api.py \
            tests/test_order_api.py \
            tests/test_order_cancel_api.py \
            tests/test_order_query_api.py \
            tests/test_payment_api.py \
            tests/test_payment_expiry_service.py \
            tests/test_skin_api.py \
            tests/test_event_api.py \
            tests/test_user_activity_api.py

      - name: Run backend full tests
        if: github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.backend_test_suite == 'full')
        run: docker compose exec -T backend python -m pytest

      - name: Check backend Alembic config
        run: docker compose exec -T backend python -m alembic heads

      - name: Check frontend hello page
        run: curl --fail --retry 20 --retry-all-errors --retry-delay 2 http://localhost:5173

      - name: Stop Docker Compose services
        if: always()
        run: docker compose down -v
