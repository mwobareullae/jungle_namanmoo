name: weekly evidence discovery

permissions:
  contents: read

on:
  pull_request:
    branches:
      - dev
    paths:
      - ".github/workflows/evidence-discovery.yml"
      - "data/scripts/discover_new_evidence.py"
      - "data/scripts/publish_evidence_candidates.py"
      - "data/scripts/tests/test_discover_new_evidence.py"
      - "data/scripts/tests/test_publish_evidence_candidates.py"
      - "docs/scoring/evidence-discovery-operations.md"
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/evidence-discovery.yml"
      - "data/ingredient_aliases.csv"
      - "data/ingredient_effect.csv"
      - "data/ingredient_evidence.csv"
      - "data/ingredients.csv"
      - "data/scripts/discover_new_evidence.py"
      - "data/scripts/publish_evidence_candidates.py"
      - "data/scripts/tests/test_discover_new_evidence.py"
      - "data/scripts/tests/test_publish_evidence_candidates.py"
  schedule:
    # Monday 09:17 KST. Non-zero minute reduces peak-time schedule delays.
    - cron: "17 0 * * 1"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Entrez 등록일 검색 범위(일)"
        required: true
        default: "8"
        type: string

concurrency:
  group: evidence-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: collector unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout pull request
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7

      - name: Checkout dev
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: dev

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run collector tests
        run: python -m unittest discover -s data/scripts/tests -p "test_*.py" -v

  discover:
    name: discover new PubMed candidates
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '8' }}
      NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      EVIDENCE_INGEST_URL: ${{ vars.EVIDENCE_INGEST_URL }}
      EVIDENCE_INGEST_TOKEN: ${{ secrets.EVIDENCE_INGEST_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: dev

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Discover candidates
        run: |
          python data/scripts/discover_new_evidence.py \
            --days "$LOOKBACK_DAYS" \
            --output-dir artifacts/evidence-discovery

      - name: Publish run summary
        run: cat artifacts/evidence-discovery/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Validate candidate persistence configuration
        run: |
          if [ -z "$EVIDENCE_INGEST_URL" ] || [ -z "$EVIDENCE_INGEST_TOKEN" ]; then
            echo "::error::EVIDENCE_INGEST_URL/TOKEN 미설정: 후보 DB 영구 저장을 완료할 수 없습니다."
            exit 1
          fi

      - name: Persist candidates in review inbox
        run: |
          python data/scripts/publish_evidence_candidates.py \
            --input artifacts/evidence-discovery/new_evidence_candidates.csv

      - name: Upload candidate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-candidates-${{ github.run_id }}
          path: artifacts/evidence-discovery/
          if-no-files-found: error
          retention-days: 90
