name: pr-comment-notify

permissions:
  contents: read
  issues: read
  pull-requests: read

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  notify:
    name: Slack PR 코멘트 알림
    runs-on: ubuntu-latest
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request != null

    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Build Slack payload
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const eventName = context.eventName;
            const fallback = "_내용 없음_";

            const truncate = (value, max = 2800) => {
              const text = value && String(value).trim() ? String(value).trim() : fallback;
              return text.length > max ? `${text.slice(0, max)}\n...` : text;
            };

            const slackLinkText = (value) =>
              String(value || "").replace(/[|<>]/g, " ").trim();

            const reviewState = {
              approved: "승인",
              changes_requested: "변경 요청",
              commented: "리뷰 코멘트",
              dismissed: "리뷰 해제",
            };

            let title;
            let link;
            let body;
            let author;
            let contextText;

            if (eventName === "issue_comment") {
              const issue = context.payload.issue;
              const comment = context.payload.comment;
              title = `💬 PR #${issue.number} 코멘트`;
              link = `<${comment.html_url}|${slackLinkText(issue.title)}>`;
              body = comment.body;
              author = comment.user.login;
              contextText = "Conversation 댓글";
            } else if (eventName === "pull_request_review_comment") {
              const pr = context.payload.pull_request;
              const comment = context.payload.comment;
              title = `💬 PR #${pr.number} 라인 코멘트`;
              link = `<${comment.html_url}|${slackLinkText(pr.title)}>`;
              body = comment.body;
              author = comment.user.login;
              contextText = comment.path ? `Files changed: ${comment.path}` : "Files changed 댓글";
            } else {
              const pr = context.payload.pull_request;
              const review = context.payload.review;
              const state = reviewState[review.state] || review.state;
              title = `📝 PR #${pr.number} 리뷰 ${state}`;
              link = `<${review.html_url || pr.html_url}|${slackLinkText(pr.title)}>`;
              body = review.body || `리뷰 상태: ${state}`;
              author = review.user.login;
              contextText = "PR review";
            }

            const payload = {
              attachments: [
                {
                  color: "#6B7280",
                  blocks: [
                    {
                      type: "section",
                      text: {
                        type: "mrkdwn",
                        text: `*${title}*`,
                      },
                    },
                    {
                      type: "section",
                      text: {
                        type: "mrkdwn",
                        text: link,
                      },
                    },
                    { type: "divider" },
                    {
                      type: "section",
                      text: {
                        type: "mrkdwn",
                        text: truncate(body),
                      },
                    },
                    {
                      type: "context",
                      elements: [
                        {
                          type: "mrkdwn",
                          text: `작성자: ${author}  |  ${contextText}`,
                        },
                      ],
                    },
                  ],
                },
              ],
            };

            fs.writeFileSync("slack-pr-comment-notify.json", JSON.stringify(payload));

      - name: Slack 알림
        if: env.SLACK_WEBHOOK_URL != ''
        continue-on-error: true
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: slack-pr-comment-notify.json
