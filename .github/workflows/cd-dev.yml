name: cd-dev

permissions:
  contents: read

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: dev-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy dev server
    runs-on: ubuntu-latest

    env:
      DEV_HOST: ${{ secrets.DEV_HOST }}
      DEV_USER: ${{ secrets.DEV_USER }}
      DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
      DEV_APP_DIR: ${{ secrets.DEV_APP_DIR }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail

          test -n "$DEV_HOST"
          test -n "$DEV_USER"
          test -n "$DEV_APP_DIR"
          test -n "$DEV_SSH_KEY"

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEV_SSH_KEY" > ~/.ssh/dev_key
          chmod 600 ~/.ssh/dev_key
          ssh-keyscan -H "$DEV_HOST" >> ~/.ssh/known_hosts

      - name: Sync checkout to dev server
        shell: bash
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/dev_key "$DEV_USER@$DEV_HOST" "mkdir -p '$DEV_APP_DIR'"
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'node_modules' \
            --exclude 'docker-data' \
            -e "ssh -i ~/.ssh/dev_key" \
            ./ "$DEV_USER@$DEV_HOST:$DEV_APP_DIR/"

      - name: Deploy with Docker Compose
        shell: bash
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/dev_key "$DEV_USER@$DEV_HOST" "
            set -euo pipefail
            cd '$DEV_APP_DIR'
            test -f .env || cp .env.example .env
            if [ -f data/scripts/build_seed_subset.py ] && [ -f data/products.csv ]; then
              python3 data/scripts/build_seed_subset.py --source-dir data --output-dir data/dev-small --force
            fi
            docker compose -f docker-compose.yml -f docker-compose.proxy.yml --profile search-cache config
            docker compose -f docker-compose.yml -f docker-compose.proxy.yml stop frontend || true
            docker compose -f docker-compose.yml -f docker-compose.proxy.yml rm -f frontend || true
            docker compose -f docker-compose.yml -f docker-compose.proxy.yml --profile search-cache up --build -d backend redis elasticsearch caddy
            docker compose ps
          "

      - name: Check dev server health
        shell: bash
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/dev_key "$DEV_USER@$DEV_HOST" "
            set -euo pipefail
            curl --fail --retry 20 --retry-all-errors --retry-delay 2 http://localhost:8000/api/health
          "

      - name: Build Slack payload
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const payload = {
              attachments: [
                {
                  color: "#E01E5A",
                  blocks: [
                    {
                      type: "header",
                      text: {
                        type: "plain_text",
                        text: "🚨 dev API 배포 완료 — 즉시 Pull 필요",
                        emoji: true,
                      },
                    },
                    { type: "divider" },
                    {
                      type: "section",
                      text: {
                        type: "mrkdwn",
                        text: ":point_right: *지금 바로 `git pull` 해주세요*\nEC2는 backend/API 중심으로 배포됐고, frontend는 Vercel 배포 상태를 확인해주세요.",
                      },
                    },
                    {
                      type: "section",
                      fields: [
                        {
                          type: "mrkdwn",
                          text: `*배포자*\n${context.actor}`,
                        },
                        {
                          type: "mrkdwn",
                          text: `*브랜치*\n\`${context.ref.replace("refs/heads/", "")}\``,
                        },
                      ],
                    },
                    {
                      type: "context",
                      elements: [
                        {
                          type: "mrkdwn",
                          text: `<${runUrl}|GitHub Actions 실행 내역>`,
                        },
                      ],
                    },
                  ],
                },
              ],
            };

            fs.writeFileSync("slack-cd-dev.json", JSON.stringify(payload));

      - name: Slack 알림
        if: env.SLACK_WEBHOOK_URL != ''
        continue-on-error: true
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: slack-cd-dev.json
