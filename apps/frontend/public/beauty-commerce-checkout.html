<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>뭐바를래 - 장바구니 주문서</title>
  <link rel="stylesheet" href="./Design_system/aqua-glass-system.css">
  <link rel="stylesheet" href="./Design_system/aqua-glass-shopping.css">
  <link rel="stylesheet" href="./Design_system/aqua-checkout.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="./beauty-commerce-aqua-glass.html" class="logo">뭐바를래</a>
      <nav>
        <a href="./beauty-commerce-aqua-glass.html#defaultSection">신상품</a>
        <a href="./beauty-commerce-aqua-glass.html#defaultSection">베스트</a>
        <a href="./beauty-commerce-aqua-glass.html#defaultSection">스킨케어</a>
        <a href="./beauty-commerce-aqua-glass.html#defaultSection">메이크업</a>
        <a href="./beauty-commerce-aqua-glass.html#defaultSection">브랜드</a>
        <a href="./beauty-commerce-aqua-glass.html" class="nav-ai">맞춤 추천</a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn" type="button" aria-label="검색">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </button>
        <button class="btn-login" type="button">로그인</button>
      </div>
    </div>
  </header>

  <main class="checkout-page">
    <section class="checkout-shell">
      <div class="checkout-title-row">
        <div>
          <h1>장바구니 주문서</h1>
          <p>성분 근거로 고른 상품을 확인하고 배송·결제 정보를 입력해주세요.</p>
        </div>
        <div class="checkout-steps">
          <strong>장바구니</strong>
          <span>›</span>
          <strong>주문서</strong>
          <span>›</span>
          <span>결제완료</span>
        </div>
      </div>

      <div class="checkout-layout">
        <div class="checkout-main">
          <section class="checkout-card">
            <div class="checkout-card-head">
              <h2>주문 상품</h2>
              <span id="cartCountLabel">상품 1개</span>
            </div>
            <div id="cartItems"></div>
          </section>

          <section class="checkout-card">
            <div class="checkout-card-head">
              <h2>배송 정보</h2>
              <span>필수 입력</span>
            </div>
            <div class="form-grid">
              <div class="form-field">
                <label for="receiverName">받는 분</label>
                <input id="receiverName" value="나코" autocomplete="name">
              </div>
              <div class="form-field">
                <label for="receiverPhone">연락처</label>
                <input id="receiverPhone" value="010-0000-0000" autocomplete="tel">
              </div>
              <div class="form-field full">
                <label for="address">주소</label>
                <input id="address" value="서울특별시 성분구 피부로 12" autocomplete="street-address">
              </div>
              <div class="form-field full">
                <label for="memo">배송 요청사항</label>
                <select id="memo">
                  <option>문 앞에 놓아주세요</option>
                  <option>경비실에 맡겨주세요</option>
                  <option>배송 전 연락주세요</option>
                </select>
              </div>
            </div>
          </section>

          <section class="checkout-card">
            <div class="checkout-card-head">
              <h2>결제 수단</h2>
              <span>선택 1개</span>
            </div>
            <div class="payment-options">
              <button class="payment-option active" type="button">간편결제</button>
              <button class="payment-option" type="button">신용카드</button>
              <button class="payment-option" type="button">무통장입금</button>
            </div>
          </section>
        </div>

        <aside class="order-summary">
          <h2>결제 금액</h2>
          <div class="summary-row">
            <span>상품 금액</span>
            <strong id="summarySubtotal">0원</strong>
          </div>
          <div class="summary-row">
            <span>상품 할인</span>
            <strong id="summaryDiscount">-0원</strong>
          </div>
          <div class="summary-row">
            <span>배송비</span>
            <strong>무료</strong>
          </div>
          <div class="summary-divider"></div>
          <div class="summary-total">
            <span>총 결제금액</span>
            <strong id="summaryTotal">0원</strong>
          </div>
          <button class="checkout-btn-main" type="button" data-pay-button>결제하기</button>
          <p class="summary-note">결제하기를 누르면 주문 내용을 확인한 것으로 간주됩니다. 실제 결제는 연결되지 않은 시안 화면입니다.</p>
        </aside>
      </div>
    </section>
  </main>

  <div class="mobile-pay-bar">
    <div class="mobile-pay-total">
      <span>총 결제금액</span>
      <strong id="mobileTotal">0원</strong>
    </div>
    <button class="checkout-btn-main" type="button" data-pay-button>결제하기</button>
  </div>

  <script>
    const products = [
      {
        id: 10,
        brand: '라로슈포제',
        name: '라로슈포제 시카플라스트 밤 B5+ 100ml 기획 (+3ml 추가증정)',
        image: 'outputs/oliveyoung_ranking_10_20/images/rank10_A000000206904.jpg',
        price: 34850,
        original: 41000,
        priceText: '34,850원',
        originalText: '41,000원',
        chips: ['판테놀', '마데카소사이드', '글리세린']
      },
      {
        id: 12,
        brand: '웰라쥬',
        name: '[속건조필수템] 웰라쥬 리얼 히알루로닉 블루 100 앰플 75ml 2입 기획',
        image: 'outputs/oliveyoung_ranking_10_20/images/rank12_A000000231885.jpg',
        price: 29800,
        original: 50000,
        priceText: '29,800원',
        originalText: '50,000원',
        chips: ['판테놀', '히알루론산', '글리세린']
      },
      {
        id: 15,
        brand: '라운드랩',
        name: '[6월올영픽/총200ml] 라운드랩 자작나무 수분 크림 80ml+80ml 더블 기획 (+40ml)',
        image: 'outputs/oliveyoung_ranking_10_20/images/rank15_A000000255244.jpg',
        price: 24600,
        original: 44000,
        priceText: '24,600원',
        originalText: '44,000원',
        chips: ['판테놀', '히알루론산', '글리세린']
      }
    ];

    const params = new URLSearchParams(window.location.search);
    const selectedId = Number(params.get('id'));
    const mode = params.get('mode') || 'cart';
    const items = selectedId
      ? [products.find(item => item.id === selectedId) || products[0]]
      : products;

    function formatWon(value) {
      return `${value.toLocaleString('ko-KR')}원`;
    }

    const subtotal = items.reduce((sum, item) => sum + item.original, 0);
    const total = items.reduce((sum, item) => sum + item.price, 0);
    const discount = subtotal - total;

    document.querySelector('h1').textContent = mode === 'buy' ? '바로 구매 주문서' : '장바구니 주문서';
    document.getElementById('cartCountLabel').textContent = `상품 ${items.length}개`;
    document.getElementById('cartItems').innerHTML = items.map(item => `
      <div class="cart-line">
        <img src="${item.image}" alt="${item.brand} ${item.name}">
        <div>
          <div class="cart-brand">${item.brand}</div>
          <div class="cart-name">${item.name}</div>
          <div class="cart-meta">${item.chips.map(chip => `<span class="cart-chip">${chip}</span>`).join('')}</div>
        </div>
        <div>
          <div class="cart-price">${item.priceText}</div>
          <div class="cart-qty">수량 1개</div>
        </div>
      </div>
    `).join('');
    document.getElementById('summarySubtotal').textContent = formatWon(subtotal);
    document.getElementById('summaryDiscount').textContent = `-${formatWon(discount)}`;
    document.getElementById('summaryTotal').textContent = formatWon(total);
    document.getElementById('mobileTotal').textContent = formatWon(total);

    document.querySelectorAll('.payment-option').forEach(button => {
      button.addEventListener('click', () => {
        document.querySelectorAll('.payment-option').forEach(item => item.classList.remove('active'));
        button.classList.add('active');
      });
    });

    document.querySelectorAll('[data-pay-button]').forEach(button => {
      button.addEventListener('click', () => {
        const representative = items[0] || products[0];
        const nextUrl = `./beauty-commerce-payment-complete.html?id=${representative.id}&total=${total}&count=${items.length}`;
        window.location.href = nextUrl;
      });
    });
  </script>
</body>
</html>
