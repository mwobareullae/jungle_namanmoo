<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>뭐바를래</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="./Design_system/aqua-glass-system.css">
  <link rel="stylesheet" href="./Design_system/aqua-glass-shopping.css">
  <link rel="stylesheet" href="./Design_system/aqua-payment-complete.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="./beauty-commerce-aqua-glass.html" class="logo">뭐바를래</a>
      <nav>
        <a href="./beauty-commerce-aqua-glass.html#defaultSection">신상품</a>
        <a href="./beauty-commerce-aqua-glass.html#defaultSection">베스트</a>
        <a href="./beauty-commerce-aqua-glass.html#defaultSection">스킨케어</a>
        <a href="./beauty-commerce-aqua-glass.html#defaultSection">브랜드</a>
        <a href="./beauty-commerce-aqua-glass.html" class="nav-ai">맞춤 추천</a>
      </nav>
    </div>
  </header>

  <main class="complete-page">
    <section class="complete-shell">
      <div class="complete-hero">
        <div class="complete-mark">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
        <h1>결제가 완료되었습니다</h1>
        <p>피부 고민에 맞춰 고른 상품 주문이 접수되었어요. 주문 정보와 배송 진행 상황은 마이페이지에서 확인할 수 있습니다.</p>
      </div>

      <div class="complete-grid">
        <section class="complete-card">
          <h2>주문 정보</h2>
          <div class="complete-row">
            <span>주문번호</span>
            <strong id="orderNo">-</strong>
          </div>
          <div class="complete-row">
            <span>결제금액</span>
            <strong id="paidTotal">0원</strong>
          </div>
          <div class="complete-row">
            <span>결제수단</span>
            <strong>간편결제</strong>
          </div>
          <div class="complete-row">
            <span>배송 예정</span>
            <strong>내일 출고 예정</strong>
          </div>
        </section>

        <section class="complete-card">
          <h2>주문 상품</h2>
          <div class="complete-product">
            <img id="productImage" src="" alt="">
            <div>
              <div class="complete-brand" id="productBrand"></div>
              <div class="complete-name" id="productName"></div>
            </div>
          </div>
        </section>
      </div>

      <div class="complete-actions">
        <a class="complete-btn" href="./beauty-commerce-aqua-glass.html">쇼핑 계속하기</a>
        <a class="complete-btn primary" href="./beauty-commerce-product-detail.html?id=10">상품 다시 보기</a>
      </div>
    </section>
  </main>

  <script>
    const products = {
      10: {
        brand: '라로슈포제',
        name: '라로슈포제 시카플라스트 밤 B5+ 100ml 기획 (+3ml 추가증정)',
        image: ''
      },
      12: {
        brand: '웰라쥬',
        name: '[속건조필수템] 웰라쥬 리얼 히알루로닉 블루 100 앰플 75ml 2입 기획',
        image: ''
      },
      15: {
        brand: '라운드랩',
        name: '[6월올영픽/총200ml] 라운드랩 자작나무 수분 크림 80ml+80ml 더블 기획 (+40ml)',
        image: ''
      }
    };

    const params = new URLSearchParams(window.location.search);
    const id = Number(params.get('id')) || 10;
    const total = Number(params.get('total')) || 0;
    const count = Number(params.get('count')) || 1;
    const product = products[id] || products[10];
    const orderSuffix = String(Date.now()).slice(-8);

    document.getElementById('orderNo').textContent = `MWB-${orderSuffix}`;
    document.getElementById('paidTotal').textContent = total ? `${total.toLocaleString('ko-KR')}원` : '결제금액 확인 중';
    document.getElementById('productImage').src = product.image;
    document.getElementById('productImage').alt = `${product.brand} ${product.name}`;
    document.getElementById('productBrand').textContent = product.brand;
    document.getElementById('productName').textContent = count > 1 ? `${product.name} 외 ${count - 1}개` : product.name;
    document.querySelector('.complete-btn.primary').href = `./beauty-commerce-product-detail.html?id=${id}`;
  </script>
</body>
</html>
